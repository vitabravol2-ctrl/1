<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Local AI Trading Terminal</title><link rel='stylesheet' href='/web/style.css'></head><body>
<header><div><h1>Local AI Trading Terminal <span>v0.2.0</span></h1><p id='topStatus'>DRY-RUN | AI SIM | Market DEMO</p></div><button id='emergencyBtn' class='danger'>Emergency Stop</button></header>
<main>
<section class='chat'><h2>AI Operator Chat</h2><div id='chatLog' class='panel grow'></div><div class='quick'><button data-q='проанализируй пару'>Analyze pair</button><button data-q='какие стратегии предложишь'>Suggest strategies</button><button id='testGptBtn'>Test GPT</button><button id='startSelected'>Start selected strategy</button><button id='stopBtn'>Stop strategy</button><button id='reportBtn'>Create report</button></div><form id='chatForm'><input id='chatInput' placeholder='Введите команду...' /><button>Send</button></form></section>
<section class='workspace'><h2>Market / Strategy Workspace</h2><label>Pair <select id='pair'><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option></select></label><button id='testBinanceBtn'>Test Binance</button><div id='market' class='panel'></div><div id='strategy' class='panel'></div><div id='pendingPlan' class='panel'></div><div class='panel'><h3>Settings</h3><p>OpenAI key: loaded from .env (hidden)</p><p>Binance public: ON/OFF auto with fallback</p><p>Binance private/live: LOCKED</p></div></section>
</main>
<section class='bottom'><div class='panel'><h3>Active Runtime</h3><pre id='runtime'></pre></div><div class='panel'><h3>Trades (DRY-RUN)</h3><div id='trades'></div></div><div class='panel'><h3>Errors only</h3><div id='errors'></div></div></section>
<div id='reportModal' class='modal hidden'><div class='panel'><h3>Report</h3><textarea id='reportText'></textarea><button id='closeReport'>Close</button></div></div>
<script src='/web/app.js'></script></body></html>
