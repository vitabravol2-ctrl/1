<!doctype html><html><head><meta charset='utf-8'/><meta name='viewport' content='width=device-width,initial-scale=1'/><title>Local AI Trading Terminal</title><link rel='stylesheet' href='/web/style.css'></head><body>
<header><div><h1>Local AI Trading Terminal <span>v0.3.0</span></h1><p id='topStatus'></p></div></header>
<main><section class='workspace'><h2>Trading Control</h2>
<div class='quick'>
<button id='startSelected'>Start Strategy</button><button id='confirmPlan'>Confirm Plan</button><button id='cancelPlan'>Cancel Plan</button><button id='pauseBtn'>Pause</button><button id='resumeBtn'>Resume</button><button id='stopBtn'>Stop</button><button id='emergencyBtn' class='danger'>Emergency Stop</button>
</div>
<div class='line'><label>Pair <select id='pair'><option>BTCUSDT</option><option>ETHUSDT</option><option>BNBUSDT</option><option>SOLUSDT</option></select></label></div>
<div id='market' class='panel'></div><div id='runtime' class='panel'></div><div id='trades' class='panel'></div><div id='errors' class='panel'></div>
<h3>Settings</h3><div id='settingsPanel' class='panel'></div><button id='saveSettings'>Save Settings</button>
<div class='quick'><button id='testPublic'>Test Binance Public</button><button id='testPrivate'>Test Binance Private Read-Only</button><button id='testTestnet'>Test Binance Testnet</button><button id='checkFilters'>Check Symbol Filters</button></div>
</section></main>
<script src='/web/app.js'></script></body></html>
