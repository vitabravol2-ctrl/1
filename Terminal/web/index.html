<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Local AI Trading Terminal</title><link rel='stylesheet' href='style.css'></head><body><div class='wrap'><h1>Local AI Trading Terminal v1.0.0</h1><div class='badge' id='env'>TESTNET</div><section><h2>1. Connection</h2><input id='apiKey' placeholder='API Key'><input id='apiSecret' placeholder='API Secret' type='password'><label><input id='useTestnet' type='checkbox' checked> Use Testnet</label><button onclick='connectApi()'>Connect</button><div id='conn'>DISCONNECTED</div><div>Balance: <span id='balance'>0</span> USDT</div></section><section><h2>2. Market</h2><div>Pair: BTCUSDT</div><div>Price: <span id='price'>-</span></div><div>Bid: <span id='bid'>-</span> Ask: <span id='ask'>-</span> Spread: <span id='spread'>-</span></div><div>Socket: <span id='socket'>-</span></div></section><section><h2>3. Scalping Settings</h2><select id='mode'><option>DRY_RUN</option><option>TESTNET</option><option>LIVE_LOCKED</option></select><input id='orderSizeUsdt' type='number' value='20'><input id='takeProfitPct' type='number' value='0.2'><input id='stopLossPct' type='number' value='0.2'><input id='buyBelowPct' type='number' value='0.1'><input id='sellAbovePct' type='number' value='0.1'><input id='cooldownSeconds' type='number' value='15'><input id='maxOpenPosition' type='number' value='1'><input id='maxDailyLoss' type='number' value='20'><button onclick='saveSettings()'>Save Settings</button></section><section><h2>4. Bot Control</h2><button onclick="post('/api/start')">Start</button><button onclick="post('/api/pause')">Pause</button><button onclick="post('/api/resume')">Resume</button><button onclick="post('/api/stop')">Stop</button><button class='danger' onclick="post('/api/emergency-stop')">Emergency Stop</button></section><section><h2>5. Runtime</h2><pre id='runtime'></pre></section><section><h2>6. Trades</h2><pre id='trades'></pre></section><section><h2>7. Errors only</h2><pre id='errors'></pre></section></div><script src='app.js'></script></body></html>
